version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
      
    healthcheck:
        test: ["CMD", "rabbitmqctl", "status"]
        interval: 30s
        timeout: 10s
        retries: 5
    
  collector-python:
    build: ./collector-python
    container_name: collector-python
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: 
      - .env
      
  worker-go:
    build: ./worker-go
    container_name: worker-go
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: 
      - .env
    
  nest-api:
    build: ./nest-api
    container_name: nest-api
    env_file: 
      - .env

    ports:
      - "3000:3000"
    
  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - nest-api
    ports:
      - "80:80"
    