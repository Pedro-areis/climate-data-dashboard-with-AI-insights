services:
  mongo:
    image: mongo:7
    container_name: mongo
    # Prisma exige replica set; subimos um de 1 nó e iniciamos no healthcheck.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${USER_RABBITMQ:-guest}
      RABBITMQ_DEFAULT_PASS: ${PASSWORD_RABBITMQ:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  collector-python:
    build: ./collector-python
    container_name: collector-python
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env

  worker-go:
    build: ./worker-go
    container_name: worker-go
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env

  nest-api:
    build: ./nest-api
    container_name: nest-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - nest-api
    ports:
      - "80:80"

volumes:
  mongo-data:
